name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv venv --python 3.13
          uv pip install ether-websearch
          uv pip install -e ".[dev,openai,hf]"

      - name: Ruff check
        run: uv run ruff check webspider/ tests/

      - name: Ruff format check
        run: uv run ruff format --check webspider/ tests/

      - name: Mypy
        run: uv run mypy webspider/

      - name: Pytest
        run: uv run pytest tests/ -v --cov=webspider --cov-report=term-missing
