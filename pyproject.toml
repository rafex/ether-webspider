[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ether-webspider"
version = "0.1.0"
description = "Agente spider web orientado a objetivo con checkpoints y resume"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "smolagents>=1.10,<2.0",
    "mcp>=1.2,<2.0",
    "ether-websearch",
]

[project.optional-dependencies]
openai = ["openai>=1.0,<2.0"]
hf     = ["huggingface-hub>=0.20,<1.0"]
litellm = ["litellm>=1.0,<2.0"]
dev    = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.0,<2.0",
]

[project.scripts]
ether-webspider = "webspider.cli:main"

[project.urls]
Repository = "https://github.com/rafex/ether-webspider"

[tool.hatch.build.targets.wheel]
packages = ["webspider"]
exclude = ["tests", "tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", ".opencode", "checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
